<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Daggerfall Online — Community Client</title>
  <!-- TI2 (2026-09-11): the phone's install surface. The manifest makes
       the game a home-screen app (fullscreen, landscape, no address bar -
       the only fullscreen iOS offers a web page); the apple metas are
       Safari's older spelling of the same. -->
  
  <meta name="theme-color" content="#0a0c11" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DFO" />
  
  <style>
    html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; overscroll-behavior: none; }
    /* No blue text/UI selection anywhere in the client. Text fields stay editable/selectable. */
    html, body, body * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    input, textarea, select, [contenteditable], [contenteditable] * { -webkit-user-select: text; user-select: text; }
    ::selection { background: transparent; color: inherit; }
    input::selection, textarea::selection { background: #3a4a6b; color: #fff; }
    #c { display: block; width: 100vw; height: 100vh; touch-action: none; -webkit-user-select: none; user-select: none; }
  </style>
<meta name="robots" content="noindex,follow" />
<meta name="community-release" content="community-dev.2" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<script defer data-domain="daggerfall.online" data-api="https://data.1back.link/api/send" src="https://data.1back.link/js/app.js"></script>
<style>html,body{height:100%;height:100dvh}#c{height:100dvh;width:100%;touch-action:none}input,textarea,select{font-size:max(16px,1em)}</style>
  <script type="module" crossorigin src="../assets/main-BoKDoX6A.js"></script>
</head>
<body>
  <canvas id="c"></canvas>
</body>
</html>
